name: publish
# Publishes glassbox-trace to npm with trusted publishing (no token): npmjs.com → package → Settings →
# Trusted Publisher → GitHub Actions, repo aldohushi1-stack/glassbox, workflow publish.yml.
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
